<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e3c72">
    <title>تیمزو</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: sans-serif;
            color: #fff;
            text-align: center;
        }
        .card {
            width: min(100%, 420px);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { margin: 0 0 10px; font-size: 24px; }
        p { margin: 0 0 20px; font-size: 14px; opacity: 0.9; line-height: 1.8; }
        button {
            min-height: 48px;
            padding: 12px 24px;
            border: none;
            background: #ff5722;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
        }
        button:active { transform: scale(.98); }
    </style>
</head>
<body>
    <main class="card">
        <h1>اپلیکیشن اختصاصی مهندس</h1>
        <p>بدون نیاز به اندروید استودیو و دانلود سنگین!</p>
        <button type="button" onclick="alert('همه چیز کاملاً درست کار می‌کند!')">تست کلیک</button>
    </main>
</body>
</html>
